# =============================================================================
# Moss AI Agent Platform — Nginx Reverse Proxy
#
# Features:
# - Self-signed TLS (replace certs for production)
# - Basic auth (htpasswd file)
# - WebSocket upgrade support (CloudCLI PTY)
# - Large file upload support (100MB)
# - Long proxy timeouts (300s for analysis tasks)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        # TLS certificates (self-signed for pilot; replace for production)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Basic authentication
        auth_basic "Moss AI Agent Platform";
        auth_basic_user_file /etc/nginx/htpasswd;

        # Pass authenticated username to backend
        proxy_set_header X-Remote-User $remote_user;

        # Main application — proxy to CloudCLI
        location / {
            proxy_pass http://moss:3001;
            proxy_http_version 1.1;

            # WebSocket support (critical for CloudCLI PTY)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for analysis tasks
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Disable buffering for streaming responses
            proxy_buffering off;
            proxy_cache off;
        }

        # Health check endpoint (no auth required)
        location /health {
            auth_basic off;
            proxy_pass http://moss:3001/health;
        }
    }
}
