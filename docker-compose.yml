# =============================================================================
# Moss AI Agent Platform — Docker Compose
#
# Services:
#   moss   - Main AI agent container (Claude Code CLI + CloudCLI + Python)
#   nginx  - Reverse proxy with TLS + basic auth
#
# Usage:
#   cp .env.example .env            # Configure API keys
#   ./scripts/generate-certs.sh     # Generate self-signed TLS certs
#   docker compose build            # Build the image
#   docker compose up -d            # Start services
#   docker compose logs -f moss     # Watch logs
# =============================================================================

services:
  # ===== Main AI Agent Container =====
  moss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moss-agent
    restart: unless-stopped

    # --- Security ---
    # Run as non-root user (UID 1000)
    user: "0:0"  # Start as root for iptables, entrypoint drops to agent user
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN    # Required for iptables firewall setup; used only at startup
      - SETUID       # Required for gosu privilege drop in entrypoint
      - SETGID       # Required for gosu privilege drop in entrypoint
      - DAC_OVERRIDE # Required for root to init /persistent (owned by agent) at startup
      - CHOWN        # Required for chown in entrypoint before privilege drop
    security_opt:
      - no-new-privileges:true

    # --- Resource Limits ---
    mem_limit: ${MEMORY_LIMIT:-8g}
    cpus: ${CPU_LIMIT:-4}
    pids_limit: 512

    # --- Filesystem ---
    # Note: read_only disabled for Docker Desktop compatibility.
    # On Linux production, re-enable read_only: true and add tmpfs mounts.
    tmpfs:
      - /tmp:rw,nosuid,size=2g
      - /home/agent/.npm:rw,size=256m

    # --- Environment ---
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK:-0}
      - SERVER_PORT=${SERVER_PORT:-3001}
      - HOST=${HOST:-0.0.0.0}
      - CONTEXT_WINDOW=${CONTEXT_WINDOW:-160000}
      - HOME=/home/agent
      # CloudCLI database path (persisted via volume)
      - DATABASE_PATH=/home/agent/.cloudcli/auth.db
      # Default admin credentials (only used on first boot)
      - CLOUDCLI_ADMIN_USER=${CLOUDCLI_ADMIN_USER:-admin}
      - CLOUDCLI_ADMIN_PASS=${CLOUDCLI_ADMIN_PASS:-moss2026}

    # --- Volumes ---
    volumes:
      # Persistent storage for user workspaces, skills, and shared config
      - persistent-data:/persistent:rw
      # CloudCLI database (session state, user accounts)
      - cloudcli-data:/app/cloudcli/data:rw
      # Claude Code user data (skills, sessions, project configs)
      - claude-data:/home/agent/.claude:rw
      # CloudCLI plugin data (installed plugins, plugin config)
      - cloudcli-plugins:/home/agent/.claude-code-ui:rw

    # --- Network ---
    # Only expose to localhost; nginx provides external access
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - moss-net

    # --- Health Check ---
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: moss-nginx
    restart: unless-stopped

    ports:
      - "443:443"
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      moss:
        condition: service_healthy

    networks:
      - moss-net

    healthcheck:
      test: ["CMD", "curl", "-sfk", "https://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# ===== Networks =====
networks:
  moss-net:
    driver: bridge

# ===== Volumes =====
volumes:
  # User workspaces, personal skills, shared enterprise skills
  persistent-data:
    driver: local

  # CloudCLI internal database (user accounts, session metadata)
  cloudcli-data:
    driver: local

  # Claude Code data (skills, sessions, project configs)
  claude-data:
    driver: local

  # CloudCLI plugin data (Moss plugins, plugin state)
  cloudcli-plugins:
    driver: local
